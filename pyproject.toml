[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epileptic-eeg-project"
version = "0.1.0"
description = "Final-year EEG seizure prediction research project"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mne>=1.10,<2",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
  "joblib>=1.4,<2",
  "streamlit>=1.45,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
