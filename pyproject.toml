[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epileptic-eeg-project"
version = "0.1.0"
description = "Final-year EEG seizure prediction research project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "mne>=1.10,<2",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
  "joblib>=1.4,<2",
  "requests>=2.32,<3",
  "streamlit>=1.45,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "pip-audit==2.10.1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
