schema_version = 1
archive = "../data/processed/chb01_boundary_v1.npz"
seed = 42
patient_independent = false

[model]
transform = "raw"
algorithm = "random_forest"
n_estimators = 300
max_depth = 8
min_samples_leaf = 10

[selection]
min_precision = 0.5
min_recall = 0.5

[splits]
train = ["chb01_01.edf", "chb01_03.edf", "chb01_04.edf", "chb01_08.edf", "chb01_16.edf"]
validation = ["chb01_15.edf", "chb01_18.edf", "chb01_20.edf"]
test = ["chb01_26.edf", "chb01_32.edf"]
